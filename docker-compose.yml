services:
  db:
    image: postgres:18.3
    container_name: forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - forum-postgres-data:/var/lib/postgresql    # <-- изменено
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forum"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  forum-postgres-data: