spring.application.name=forum

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/forum}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql

# Администратор по умолчанию (создаётся при первом запуске)
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.email=${ADMIN_EMAIL:admin@forum.local}
app.security.admin.password=${ADMIN_PASSWORD:admin123}

# JWT: секрет не короче 32 символов, срок жизни токена в минутах
app.security.jwt.secret=${JWT_SECRET:forum-dev-secret-key-derubiu-0123456789}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Логирование (формат и файл настраиваются в logback-spring.xml)
logging.level.root=INFO
logging.level.com.example.forum=DEBUG
logging.level.org.springframework.security=INFO

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
